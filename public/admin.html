<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PawMate admin</title><link rel="icon" type="image/svg+xml" href="/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head>
<body><div id="app"></div><div id="toast" role="status"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LOGO=`<a class="brand" href="/"><img src="/logo.svg" width="36" height="36" alt="">PawMate</a>`;
function toast(t){const n=$("#toast");n.textContent=t;n.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>n.style.display="none",2800)}
async function api(p,o={}){const r=await fetch("/api"+p,{method:o.method||"GET",credentials:"same-origin",headers:o.body?{"Content-Type":"application/json"}:undefined,body:o.body&&JSON.stringify(o.body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Something went wrong");return j}
const guard=f=>async(...a)=>{try{await f(...a)}catch(e){toast(e.message)}};
async function boot(){let me=null;try{me=(await api("/me")).user}catch{}me&&me.admin?list():login()}
function login(){$("#app").innerHTML=`<div class="wrap" style="max-width:420px">${LOGO}<h1>Admin sign in</h1><div class="panel"><label class="f">Email<input id="e" type="email"></label><label class="f">Password<input id="p" type="password"></label><button class="btn" id="go">Log in</button></div></div>`;
 $("#go").onclick=guard(async()=>{await api("/admin/login",{method:"POST",body:{email:$("#e").value,password:$("#p").value}});boot()})}
async function list(){const{docs}=await api("/admin/docs"),{reports,suspended}=await api("/admin/reports");
 $("#app").innerHTML=`<div class="wrap"><header>${LOGO}<nav><button onclick="out()">Log out</button></nav></header><h1>Documents to review.</h1>${docs.length?`<div class="grid">${docs.map(d=>`<div class="card"><b>${esc(d.dog)}</b><div class="meta">${esc(d.type)}, owner ${esc(d.owner)}</div><a class="lnk" target="_blank" href="/api/docs/${d.id}/file">View ${esc(d.orig)}</a><div style="display:flex;gap:8px"><button class="btn" data-ok="${d.id}">Approve</button><button class="btn alt" data-no="${d.id}">Reject</button></div></div>`).join("")}</div>`:`<div class="empty">Nothing waiting for review.</div>`}<h1>Reports.</h1>${reports.length?`<div class="grid">${reports.map(x=>`<div class="card"><b>${esc(x.dog||"Removed dog")}</b><div class="meta">Owner ${esc(x.owner)}, ${x.total} open report${x.total>1?"s":""}</div><div><b>${esc(x.reason)}</b></div><div class="meta">${esc(x.details)} Reported by ${esc(x.reporter)}.</div><div style="display:flex;gap:8px"><button class="btn" data-sus="${x.id}">Suspend owner</button><button class="btn alt" data-dis="${x.id}">Dismiss</button></div></div>`).join("")}</div>`:`<div class="empty">No open reports.</div>`}${suspended.length?`<div class="panel" style="margin-top:14px"><b>Suspended owners</b>${suspended.map(u=>`<div class="doc"><span>${esc(u.name)}, ${esc(u.contact)}</span><button class="lnk" data-res="${u.id}">Restore</button></div>`).join("")}</div>`:""}</div>`;
 const rv=(id,approve)=>guard(async()=>{await api("/admin/docs/"+id,{method:"POST",body:{approve}});list()});
 document.querySelectorAll("[data-ok]").forEach(b=>b.onclick=rv(b.dataset.ok,true));document.querySelectorAll("[data-no]").forEach(b=>b.onclick=rv(b.dataset.no,false));const rr=(id,suspend)=>guard(async()=>{await api("/admin/reports/"+id,{method:"POST",body:{suspend}});list()});document.querySelectorAll("[data-dis]").forEach(b=>b.onclick=rr(b.dataset.dis,false));document.querySelectorAll("[data-sus]").forEach(b=>b.onclick=rr(b.dataset.sus,true));document.querySelectorAll("[data-res]").forEach(b=>b.onclick=guard(async()=>{await api("/admin/users/"+b.dataset.res+"/restore",{method:"POST"});list()}))}
const out=guard(async()=>{await api("/logout",{method:"POST"});login()});
boot();
</script></body></html>
